[package]
name = "netabase_arena"
version = "0.1.0"
edition = "2024"

[features]
# Enables compile-time slot-index bounds checking via const generics.
# Requires a nightly compiler (uses generic_const_exprs).
const-index = []
# Adds bytemuck::Pod + bytemuck::Zeroable bounds to ArenaType::Archived.
# Enables rend's bytemuck impls so archived integers satisfy them.
pod = ["dep:bytemuck", "dep:rend", "rend/bytemuck-1"]

[dependencies]
# `unaligned` makes every archived primitive align-1: repr(C) archived structs
# composed of them have zero padding, which is what makes the crate-wide
# NoUndef guarantee (and deterministic canonical byte forms) hold structurally.
rkyv = { version = "0.8.16", features = ["unaligned"] }
bytemuck = { version = "1", optional = true, default-features = false }
# Only to switch on rend/bytemuck-1 (rend is already in the tree via rkyv).
rend = { version = "0.5.3", optional = true, default-features = false }

[dev-dependencies]
trybuild = "1.0"
# Unconditional in tests so trybuild fixtures compile under any feature set.
bytemuck = { version = "1", default-features = false }
